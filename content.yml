# SOFTWARE AND PROJECTS
# featured: true shows the project as a large card at the top
# ------------------------------------------------------------
software:
  - name: "GeoFlow"
    featured: true
    summary: "An Earth Engine-style Python framework for Earth observation, GIS, spatial statistics and geospatial machine learning."
    details:
      - "Familiar Earth Engine syntax (filterBounds, filterDate, reduceRegion, Map.addLayer) on top of the open Python stack."
      - "Loads Sentinel-2 and other collections from STAC catalogs such as Microsoft Planetary Computer, and NASA GEDI LiDAR through Earthdata."
      - "Leakage-safe spatial machine learning: spatial blocking, buffered spatial cross-validation and leakage reports."
      - "Spatial statistics (Moran's I, LISA, Geary's C, semivariograms) and PyTorch patch datasets for deep learning."
    code: |
      import geoflow as gf
      aoi = gf.Rectangle([91.76, 22.27, 91.90, 22.40])  # Chattogram
      image = (gf.ImageCollection.from_stac("sentinel-2-l2a", geometry=aoi,
                   start="2024-01-01", end="2024-02-29")
               .mask_clouds().median().clip(aoi))
      image.ndvi().plot_map(cmap="RdYlGn", title="NDVI")
    tech: ["Python", "PyTorch", "STAC", "PySAL", "Rasterio"]
    repo: "https://github.com/ramiz-moktader/geoflow"
    link: "https://ramiz-moktader.github.io/geoflow/"
    link_label: "Documentation"

  - name: "Spatial Point Splitter"
    summary: "Splits reference points into train, validation and test sets with a Morton (Z-order) curve and spatial stratification, to reduce spatial autocorrelation in LULC model evaluation."
    tech: ["Python", "Spatial ML"]
    repo: "https://github.com/ramiz-moktader/geo-point-splitter"

  - name: "GeoPatch AI (QGIS plugin)"
    summary: "Generates, filters and exports image patches and label masks from georeferenced rasters to train segmentation models, with train/validation/test splitting."
    tech: ["QGIS", "Python", "Deep learning"]
    repo: "https://github.com/ramiz-moktader/geopatch_qgis_plug_in"

  - name: "KML Grid Generator"
    summary: "Tiles any area of interest with a non-overlapping grid of uniform KML polygons for systematic image download, labelling and field surveys."
    tech: ["Python", "KML"]
    repo: "https://github.com/ramiz-moktader/kml_replicator"

  - name: "Dendro Metrics"
    summary: "A Streamlit app that estimates tree biomass from height, diameter and wood density in uploaded forest inventory data."
    tech: ["Python", "Streamlit", "Forestry"]
    repo: "https://github.com/ramiz-moktader/dendro-metrics"

  - name: "Earthquake Tracking Web Map"
    summary: "A Leaflet web map that pulls live USGS earthquake data and shows events by date."
    tech: ["JavaScript", "Leaflet", "API"]
    repo: "https://github.com/ramiz-moktader/Earthquake-tracking"
    link: "https://ramiz-moktader.github.io/Earthquake-tracking/"
    link_label: "Live map"

  - name: "Social Data Sorter"
    summary: "A Streamlit tool for cleaning and sorting survey data exported from field data collection."
    tech: ["Python", "Streamlit"]
    repo: "https://github.com/ramiz-moktader/sorting-data"
    link: "https://sorting-data.streamlit.app/"
    link_label: "Open app"

  - name: "PPT Text Extractor"
    summary: "Batch-extracts text boxes from folders of PowerPoint files into Excel sheets."
    tech: ["Python", "python-pptx"]
    repo: "https://github.com/ramiz-moktader/extracting-text-from-ppt"

