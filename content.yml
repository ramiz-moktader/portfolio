# A short personal research statement. Each item is one paragraph.
statement:
  - >-
    My path into this field began with forestry fieldwork. I wanted to know
    where streams run in the hilly Chittagong Hill Tracts, how vegetation
    changed around the Rohingya camps, and how city green space relates to
    air quality. Answering those questions at scale led me to Google Earth
    Engine, and then to machine learning.
  - >-
    My MS thesis trained neural networks to find hilly streams in Sentinel
    imagery using combinations of normalized difference indices. Since then
    my work has moved toward the methods themselves: how to adapt large
    pretrained models such as NASA–IBM's Prithvi to local mapping tasks, and
    how to build networks that use spectral physics, such as strong water
    absorption in the near-infrared, instead of learning texture alone.
  - >-
    I also care about honest evaluation. Much of my recent code deals with
    spatial cross-validation and leakage between training and test data,
    which is easy to get wrong in remote sensing. For a PhD I want to work
    on geospatial foundation models and physics-informed deep learning for
    water, land cover and climate risk in data-poor regions.

